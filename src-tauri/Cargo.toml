[package]
name = "vsa-morse-code-trainer"
version = "0.7.0"
description = "A complete Morse code teaching application for Windows by Vidyasagar Academy"
authors = ["Prof. Dattaraj S. Vidyasagar", "Prof. Yash D. Vidyasagar"]
license = "GPL-3.0-only"
homepage = "https://vsa.edu.in/software/"
edition = "2024"

[lib]
name = "vsa_morse_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
