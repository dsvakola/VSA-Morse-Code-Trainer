<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- VSA Morse Code Trainer: an original drawing of a brass straight telegraph key on a mahogany base -->
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.25" stop-color="#e9c25d"/>
      <stop offset="0.6" stop-color="#b8862a"/>
      <stop offset="1" stop-color="#6b4710"/>
    </linearGradient>
    <linearGradient id="brassSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5212"/>
      <stop offset="0.35" stop-color="#f3d27a"/>
      <stop offset="0.7" stop-color="#c39233"/>
      <stop offset="1" stop-color="#6b4710"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0673a"/>
      <stop offset="0.5" stop-color="#9c4a24"/>
      <stop offset="1" stop-color="#7a3518"/>
    </linearGradient>
    <linearGradient id="woodFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d3517"/>
      <stop offset="1" stop-color="#4a1d0a"/>
    </linearGradient>
    <radialGradient id="ebony" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#6d6460"/>
      <stop offset="0.45" stop-color="#22201f"/>
      <stop offset="1" stop-color="#080707"/>
    </radialGradient>
    <pattern id="knurl" width="3" height="6" patternUnits="userSpaceOnUse">
      <rect width="3" height="6" fill="#c9982f"/>
      <rect width="1.2" height="6" fill="#6b4710"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
      <radialGradient id="badge" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#3b2416"/>
      <stop offset="1" stop-color="#170c06"/>
    </radialGradient>
    <linearGradient id="rimB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.4" stop-color="#d4a640"/>
      <stop offset="1" stop-color="#6b4710"/>
    </linearGradient>
</defs>

  <circle cx="128" cy="128" r="122" fill="url(#rimB)"/>
  <circle cx="128" cy="128" r="111" fill="url(#badge)"/>
  <g transform="translate(128 136) scale(0.86) translate(-129 -146)">
  <!-- Soft floor shadow -->
  <ellipse cx="128" cy="214" rx="112" ry="14" fill="#000" opacity="0.35" filter="url(#shadow)"/>

  <!-- Mahogany base: front face, then top face -->
  <path d="M14 168 L206 196 L242 168 L242 184 Q242 192 234 198 L210 214 Q204 218 196 217 L22 192 Q14 190 14 182 Z" fill="url(#woodFront)"/>
  <path d="M14 168 Q14 160 24 157 L64 132 Q70 128 78 129 L234 152 Q244 154 242 164 L242 168 L206 196 Q202 199 194 198 L22 174 Q14 172 14 168 Z" fill="url(#woodTop)"/>
  <!-- Wood grain -->
  <g stroke="#6e2b10" stroke-width="1.2" fill="none" opacity="0.45">
    <path d="M40 158 Q110 150 220 166"/>
    <path d="M32 165 Q120 160 200 184"/>
    <path d="M70 143 Q140 140 226 158"/>
  </g>
  <!-- Front edge highlight -->
  <path d="M22 174 L194 198" stroke="#d98a58" stroke-width="2" opacity="0.6"/>

  <!-- Brass bed plate -->
  <path d="M48 160 L170 176 L196 160 L80 146 Z" fill="url(#brass)" stroke="#5e3d0c" stroke-width="1.2"/>
  <path d="M48 160 L170 176 L170 181 L48 165 Z" fill="#7a5212"/>
  <path d="M170 176 L196 160 L196 165 L170 181 Z" fill="#5e3d0c"/>

  <!-- Back adjusting screw with knurled cap -->
  <rect x="58" y="120" width="8" height="34" fill="url(#brassSide)"/>
  <rect x="53" y="108" width="18" height="14" rx="2" fill="url(#knurl)" stroke="#5e3d0c" stroke-width="1"/>
  <ellipse cx="62" cy="108" rx="9" ry="3" fill="#f3d27a"/>

  <!-- Trunnion bridge (pivot frame) -->
  <path d="M84 156 L84 112 L120 116 L120 160" fill="none" stroke="url(#brassSide)" stroke-width="10" stroke-linejoin="round"/>
  <rect x="78" y="106" width="48" height="10" rx="2" fill="url(#brass)" stroke="#5e3d0c" stroke-width="1"/>
  <!-- Pivot screws -->
  <circle cx="84" cy="128" r="6" fill="#f3d27a" stroke="#5e3d0c" stroke-width="1.5"/>
  <circle cx="120" cy="132" r="6" fill="#f3d27a" stroke="#5e3d0c" stroke-width="1.5"/>

  <!-- Contact post with knurled cap under the lever -->
  <rect x="150" y="140" width="8" height="30" fill="url(#brassSide)"/>
  <rect x="145" y="132" width="18" height="10" rx="2" fill="url(#knurl)" stroke="#5e3d0c" stroke-width="1"/>

  <!-- Lever arm: from the back screw, through the pivot, rising to the knob -->
  <path d="M54 126 L150 132 Q174 134 194 115 L203 106 L212 114 L203 123 Q180 148 150 148 L54 140 Z"
        fill="url(#brass)" stroke="#5e3d0c" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M60 130 L150 135 Q174 137 194 120" fill="none" stroke="#fff6cf" stroke-width="2" opacity="0.8"/>

  <!-- Knob stem and ebony mushroom knob -->
  <rect x="202" y="90" width="9" height="26" rx="2" fill="url(#brassSide)" transform="rotate(12 206 104)"/>
  <ellipse cx="214" cy="88" rx="30" ry="14" fill="url(#ebony)"/>
  <path d="M184 88 Q184 102 214 102 Q244 102 244 88 Q244 96 214 97 Q184 96 184 88 Z" fill="#050404"/>
  <ellipse cx="204" cy="81" rx="11" ry="4" fill="#a59c97" opacity="0.55"/>
  </g>
</svg>
